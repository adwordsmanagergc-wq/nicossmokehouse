name: IndexNow

# After each push to the live branch, wait for Vercel to deploy, then send
# every sitemap URL to IndexNow (Bing and partners). Can also be run by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/indexnow.py
